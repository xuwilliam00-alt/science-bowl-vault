<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SciBowl Vault — Ultimate Edition</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap');

    :root {
      --bg-dark: #07090e;
      --bg-surface: #0d121c;
      --bg-card: #131a29;
      --border-subtle: #202c44;
      --accent-cyan: #22d3ee;
      --accent-pink: #f472b6;
      --accent-gold: #fbbf24;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-dark);
      background-image:
        radial-gradient(circle at 15% 15%, rgba(34, 211, 238, 0.08) 0%, transparent 45%),
        radial-gradient(circle at 85% 85%, rgba(244, 114, 182, 0.06) 0%, transparent 45%);
      background-attachment: fixed;
      color: #f1f5f9;
    }

    .font-mono-code {
      font-family: 'JetBrains Mono', monospace;
    }

    mark {
      background-color: rgba(251, 191, 36, 0.25);
      color: #fde68a;
      border-bottom: 2px solid #fbbf24;
      padding: 0.02rem 0.22rem;
      border-radius: 0.2rem;
      font-weight: 700;
    }

    .vault-panel {
      background: linear-gradient(135deg, #131a29 0%, #0d121c 100%);
      border: 1px solid var(--border-subtle);
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.05);
      transition: all 0.2s ease;
    }

    .vault-panel:hover {
      border-color: rgba(34, 211, 238, 0.4);
      box-shadow: 0 0 25px rgba(34, 211, 238, 0.12);
    }

    .vault-cell {
      background-color: #172136;
      border: 1px solid var(--border-subtle);
      transition: all 0.18s ease;
    }

    .vault-cell:hover {
      background-color: #1e2a44;
      border-color: #22d3ee;
      transform: translateY(-1px);
    }

    .vault-glow-cyan {
      box-shadow: 0 0 20px rgba(34, 211, 238, 0.2);
    }

    ::-webkit-scrollbar {
      width: 7px;
      height: 7px;
    }
    ::-webkit-scrollbar-track {
      background: #090d16;
    }
    ::-webkit-scrollbar-thumb {
      background: #202c44;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #22d3ee;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }
    .animate-shake {
      animation: shake 0.36s cubic-bezier(.36,.07,.19,.97) both;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-cyan-500/30 selection:text-cyan-200">

  <!-- ACCESS CODE LOCK GATE OVERLAY -->
  <div id="access-gate-overlay" class="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-[#05070a]/90 backdrop-blur-md transition-opacity duration-200">
    <div id="access-gate-card" class="w-full max-w-md bg-[#131a29] rounded-2xl shadow-2xl border border-[#202c44] overflow-hidden">
      <div class="grid grid-cols-2 h-1.5 w-full">
        <div class="bg-cyan-400"></div>
        <div class="bg-pink-400"></div>
      </div>

      <div class="p-7 sm:p-8">
        <div class="flex flex-col items-center text-center mb-6">
          <div class="w-16 h-16 rounded-2xl bg-[#172136] border border-cyan-400/40 flex items-center justify-center shadow-lg vault-glow-cyan mb-4">
            <i data-lucide="shield-check" class="w-8 h-8 text-cyan-400"></i>
          </div>
          <div class="inline-flex items-center gap-1.5 text-[11px] font-mono-code uppercase tracking-widest text-cyan-400 mb-1">
            <span>Secure Question Vault</span>
            <span>•</span>
            <span class="text-pink-400">Locked</span>
          </div>
          <h1 class="text-2xl font-extrabold text-white tracking-tight">SciBowl Vault</h1>
          <p class="text-xs text-slate-400 mt-1">Enter your team access key to unlock the packet database</p>
        </div>

        <form id="access-gate-form" onsubmit="handleAccessSubmit(event)" class="space-y-4">
          <div>
            <label for="access-code-input" class="block text-xs font-mono-code font-semibold uppercase tracking-wider text-slate-300 mb-1.5">
              Access Code
            </label>
            <div class="relative">
              <i data-lucide="key-round" class="w-4 h-4 text-cyan-400 absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none"></i>
              <input
                type="password"
                id="access-code-input"
                autocomplete="off"
                placeholder="Enter team access code..."
                class="w-full pl-10 pr-11 py-2.5 text-sm font-mono-code tracking-wider bg-[#090d16] text-white border border-[#202c44] rounded-xl focus:outline-none focus:border-cyan-400 transition-all placeholder:text-slate-600"
                required
              />
              <button
                type="button"
                onclick="toggleGatePasswordVisibility()"
                title="Show or hide access code"
                class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-cyan-400 p-1"
              >
                <i id="gate-eye-icon" data-lucide="eye" class="w-4 h-4"></i>
              </button>
            </div>
            <p id="access-gate-error" class="hidden text-xs font-medium text-pink-400 mt-2 flex items-center gap-1.5">
              <i data-lucide="alert-circle" class="w-3.5 h-3.5 shrink-0"></i>
              <span>Invalid access code. Please try again.</span>
            </p>
          </div>

          <button
            type="submit"
            class="w-full inline-flex items-center justify-center gap-2 py-2.5 px-4 text-sm font-bold text-slate-950 bg-cyan-400 hover:bg-cyan-300 rounded-xl shadow-md vault-glow-cyan transition-all"
          >
            <i data-lucide="unlock" class="w-4 h-4"></i>
            <span>Unlock Vault</span>
          </button>
        </form>

        <div class="mt-6 pt-4 border-t border-[#202c44] flex flex-col sm:flex-row items-center justify-between gap-2 text-[11px] text-slate-400">
          <span id="default-code-hint" class="inline-flex items-center gap-1.5">
            <i data-lucide="info" class="w-3.5 h-3.5 text-cyan-400"></i>
            Protected by secure access gate
          </span>
          <button
            type="button"
            onclick="resetAccessCodeToDefault()"
            class="text-pink-400 hover:text-pink-300 font-medium hover:underline"
          >
            Reset to Default
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- TOP COMMAND BAR -->
  <header class="bg-[#0d121c]/90 backdrop-blur-md border-b border-[#202c44] sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-[#172136] border border-cyan-400/50 flex items-center justify-center shadow-sm vault-glow-cyan">
          <i data-lucide="atom" class="w-5 h-5 text-cyan-400"></i>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="text-lg font-extrabold tracking-tight text-white leading-none">SciBowl Vault</h1>
            <span class="hidden sm:inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-mono-code font-bold uppercase tracking-wider bg-cyan-400/15 text-cyan-300 border border-cyan-400/30">
              Pro Theme
            </span>
          </div>
          <p class="text-[11px] font-mono-code text-slate-400 mt-0.5">Packet Matrix & Question Database</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button
          id="study-mode-btn"
          onclick="toggleStudyMode()"
          title="Hide answers to quiz yourself"
          class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold border border-[#202c44] bg-[#172136] text-slate-200 hover:border-cyan-400/50 transition-colors"
        >
          <i data-lucide="eye" id="study-mode-icon" class="w-3.5 h-3.5 text-cyan-400"></i>
          <span id="study-mode-label" class="hidden md:inline">Answers Visible</span>
        </button>

        <button
          onclick="openPdfModal()"
          class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-bold border border-emerald-400/40 bg-emerald-500/15 text-emerald-300 hover:bg-emerald-500/25 transition-colors"
        >
          <i data-lucide="file-up" class="w-3.5 h-3.5"></i>
          <span class="hidden sm:inline">Upload PDF(s)</span>
          <span class="sm:hidden">PDF</span>
        </button>

        <button
          onclick="openBulkModal()"
          class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold border border-pink-400/40 bg-pink-500/15 text-pink-300 hover:bg-pink-500/25 transition-colors"
        >
          <i data-lucide="file-text" class="w-3.5 h-3.5"></i>
          <span class="hidden lg:inline">Paste Text</span>
        </button>

        <button
          onclick="openAddModal()"
          class="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-lg text-xs font-bold bg-cyan-400 text-slate-950 hover:bg-cyan-300 shadow-sm transition-colors"
        >
          <i data-lucide="plus" class="w-3.5 h-3.5"></i>
          <span>Add</span>
        </button>

        <div class="relative" id="data-menu-container">
          <button
            onclick="toggleDataMenu()"
            title="Database & Security Settings"
            class="p-1.5 rounded-lg border border-[#202c44] bg-[#172136] text-slate-300 hover:border-cyan-400/50 transition-colors"
          >
            <i data-lucide="more-vertical" class="w-4 h-4"></i>
          </button>
          <div
            id="data-menu"
            class="hidden absolute right-0 mt-2 w-56 bg-[#131a29] rounded-xl shadow-2xl border border-[#202c44] py-1.5 z-40 text-xs"
          >
            <button onclick="openAccessSettingsModal(); toggleDataMenu();" class="w-full px-3.5 py-2 text-left text-cyan-300 font-semibold hover:bg-[#1e2a44] flex items-center gap-2">
              <i data-lucide="key-round" class="w-3.5 h-3.5 text-cyan-400"></i> Access Code Settings
            </button>
            <div class="my-1 border-t border-[#202c44]"></div>
            <button onclick="exportDatabase()" class="w-full px-3.5 py-2 text-left text-slate-200 hover:bg-[#1e2a44] flex items-center gap-2">
              <i data-lucide="download" class="w-3.5 h-3.5 text-slate-400"></i> Export JSON Backup
            </button>
            <label class="w-full px-3.5 py-2 text-left text-slate-200 hover:bg-[#1e2a44] flex items-center gap-2 cursor-pointer">
              <i data-lucide="upload" class="w-3.5 h-3.5 text-slate-400"></i> Import JSON Backup
              <input type="file" accept=".json" onchange="importDatabase(event)" class="hidden" />
            </label>
            <div class="my-1 border-t border-[#202c44]"></div>
            <button onclick="loadSampleDataset(true)" class="w-full px-3.5 py-2 text-left text-slate-200 hover:bg-[#1e2a44] flex items-center gap-2">
              <i data-lucide="sparkles" class="w-3.5 h-3.5 text-amber-400"></i> Reset to Sample Packets
            </button>
            <button onclick="clearAllQuestions()" class="w-full px-3.5 py-2 text-left text-pink-400 hover:bg-pink-500/15 flex items-center gap-2">
              <i data-lucide="trash-2" class="w-3.5 h-3.5"></i> Clear Entire Database
            </button>
          </div>
        </div>

        <button
          onclick="openModLoginModal()"
          title="Moderator Dashboard"
          class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold border border-purple-400/40 bg-purple-500/15 text-purple-300 hover:bg-purple-500/25 transition-colors"
        >
          <i data-lucide="shield-alert" class="w-3.5 h-3.5 text-purple-400"></i>
          <span class="hidden md:inline">Mod Hub</span>
        </button>

        <button
          onclick="lockApp()"
          title="Lock SciBowl Vault"
          class="inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg text-xs font-semibold border border-[#202c44] bg-[#172136] text-slate-300 hover:border-pink-400/60 hover:text-pink-300 transition-colors"
        >
          <i data-lucide="lock" class="w-3.5 h-3.5 text-pink-400"></i>
          <span class="hidden xl:inline">Lock</span>
        </button>
      </div>
    </div>
  </header>

  <!-- MAIN WORKSPACE -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
    <div class="vault-panel rounded-2xl p-4 sm:p-5 mb-6">
      <div class="flex flex-col lg:flex-row gap-3 items-stretch lg:items-center">
        <div class="relative flex-1">
          <i data-lucide="search" class="w-4 h-4 text-cyan-400 absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none"></i>
          <input
            type="text"
            id="search-input"
            placeholder="Search keywords across packets, questions, choices, or answers (e.g. 'Bernoulli', 'Gyrase', 'Round 4')..."
            oninput="handleSearchInput(this.value)"
            class="w-full pl-10 pr-9 py-2.5 text-sm bg-[#090d16] text-white border border-[#202c44] rounded-xl focus:outline-none focus:border-cyan-400 transition-all placeholder:text-slate-500"
          />
          <button
            id="clear-search-btn"
            onclick="clearSearch()"
            class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-cyan-400 p-1"
            title="Clear search"
          >
            <i data-lucide="x" class="w-4 h-4"></i>
          </button>
        </div>

        <div class="inline-flex rounded-xl bg-[#090d16] p-1 border border-[#202c44] shrink-0 self-start lg:self-auto">
          <button
            id="view-grid-btn"
            onclick="setViewMode('grid')"
            class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-bold bg-cyan-400 text-slate-950 shadow-sm transition-all"
          >
            <i data-lucide="layout-grid" class="w-3.5 h-3.5"></i>
            Vault Matrix
          </button>
          <button
            id="view-packets-btn"
            onclick="setViewMode('packets')"
            class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-400 hover:text-white transition-all"
          >
            <i data-lucide="folder-tree" class="w-3.5 h-3.5"></i>
            Packet Explorer
          </button>
          <button
            id="view-list-btn"
            onclick="setViewMode('list')"
            class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-400 hover:text-white transition-all"
          >
            <i data-lucide="list" class="w-3.5 h-3.5"></i>
            All Cards
          </button>
        </div>
      </div>

      <div class="mt-3.5 pt-3.5 border-t border-[#202c44] flex flex-wrap items-center gap-2.5">
        <span class="text-xs font-mono-code font-semibold text-cyan-400 flex items-center gap-1 uppercase tracking-wider">
          <i data-lucide="sliders-horizontal" class="w-3.5 h-3.5"></i> Filters:
        </span>

        <select
          id="filter-source"
          onchange="handleSourceFilterChange(this.value)"
          class="text-xs bg-[#090d16] border border-[#202c44] rounded-lg px-2.5 py-1.5 text-slate-200 focus:outline-none focus:border-cyan-400"
        >
          <option value="ALL">All Sources</option>
        </select>

        <select
          id="filter-round"
          onchange="handleFilterChange('round', this.value)"
          class="text-xs bg-[#090d16] border border-[#202c44] rounded-lg px-2.5 py-1.5 text-slate-200 focus:outline-none focus:border-cyan-400"
        >
          <option value="ALL">All Rounds</option>
        </select>

        <select
          id="filter-category"
          onchange="handleFilterChange('category', this.value)"
          class="text-xs bg-[#090d16] border border-[#202c44] rounded-lg px-2.5 py-1.5 text-slate-200 focus:outline-none focus:border-cyan-400"
        >
          <option value="ALL">All Categories</option>
          <option value="Biology">Biology</option>
          <option value="Chemistry">Chemistry</option>
          <option value="Physics">Physics</option>
          <option value="Math">Math</option>
          <option value="Earth and Space">Earth and Space</option>
          <option value="Energy">Energy</option>
          <option value="General Science">General Science</option>
        </select>

        <select
          id="filter-type"
          onchange="handleFilterChange('type', this.value)"
          class="text-xs bg-[#090d16] border border-[#202c44] rounded-lg px-2.5 py-1.5 text-slate-200 focus:outline-none focus:border-cyan-400"
        >
          <option value="ALL">Toss-up & Bonus</option>
          <option value="Toss-up">Toss-up Only</option>
          <option value="Bonus">Bonus Only</option>
        </select>

        <button
          id="reset-filters-btn"
          onclick="resetAllFilters()"
          class="hidden text-xs font-mono-code font-semibold text-amber-400 hover:text-amber-300 px-2.5 py-1 rounded-lg bg-amber-400/10 border border-amber-400/30 transition-colors"
        >
          Reset Filters
        </button>

        <div class="ml-auto flex items
